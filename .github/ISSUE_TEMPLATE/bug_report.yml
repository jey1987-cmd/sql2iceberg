name: Bug report
description: Something failed or gave a wrong result
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please read docs/troubleshooting.md first. Never paste passwords, tokens, private keys or account secrets.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or code that failed
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment (run `sql2iceberg doctor`, or `sql2iceberg issue --open` to fill this in)
      render: text
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Trace or error output (use `--trace trace.jsonl`; read it for anything private first)
      render: text
  - type: dropdown
    id: platform
    attributes:
      label: Platform involved
      multiple: true
      options: [Snowflake, AWS Glue/Athena, BigQuery, Postgres, MySQL, SQL Server, Oracle, Spark/Iceberg, Conversion, Other]
