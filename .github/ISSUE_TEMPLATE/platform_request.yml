name: Platform test report or request
description: Report that a connector or target works (or not) for you, or ask for a new one
labels: [platform]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options: [Tested an experimental connector, Request a new source platform, Request a new target platform]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and version
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What you ran and what happened
