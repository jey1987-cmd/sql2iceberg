[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sf2iceberg"            # working name: check PyPI/GitHub availability and rename if needed
version = "0.1.0.dev0"
description = "Detect Snowflake SQL in code, convert it for Spark/Iceberg, and verify the result under pytest."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeyaraman Ramalingam" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Framework :: Pytest",
]
dependencies = ["sqlglot>=30"]

[project.optional-dependencies]
spark = ["pyspark>=3.5,<4"]
pytest = ["pytest>=8", "chispa>=0.10", "pyspark>=3.5,<4"]
dev = ["pytest>=8", "ruff"]

[project.scripts]
sf2iceberg = "sf2iceberg.cli:main"

[project.entry-points.pytest11]
sf2iceberg = "sf2iceberg.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/sf2iceberg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "spark: needs a local Spark session (pip install 'sf2iceberg[pytest]')",
  "live_snowflake: runs against a real Snowflake account; skipped unless --live-snowflake",
]

[tool.ruff]
line-length = 100
